# Intégration continue
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push annule le run encore en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Modèles de vision
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-models.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Entraînement sur un dataset synthétique
        working-directory: training
        run: |
          uv run mudra-train synth --dataset ../target/synth/dataset
          uv run mudra-train all --dataset ../target/synth/dataset --models ../target/synth/models --golden ../target/synth/golden --reports ../target/synth/reports --epochs 30
      # Sans caméra : les tests matériels sont marqués #[ignore].
      - run: cargo test --workspace
        env:
          MUDRA_GOLDEN_DIR: ${{ github.workspace }}\target\synth\golden

  # Action Docker : uniquement sur un runner Linux. deny.toml cible Windows.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
